[package]
name = "app"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["real"]

[dependencies]
old = { package = "real", path = "real", version = "1" }

[features]
# Feature refs use the MANIFEST key (`old`): cargo rejects `real/feat`
# ("`real` is not a dependency") since the dependency is named `old`.
f = ["old/feat"]
